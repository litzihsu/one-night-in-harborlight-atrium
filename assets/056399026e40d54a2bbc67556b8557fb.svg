<svg xmlns="http://www.w3.org/2000/svg" width="326" height="112" viewBox="0 0 326 112"><rect x="0" y="0" width="326" height="112" rx="8" fill="#fff9ec" stroke="#bed4ce" stroke-width="1"/><text x="163" y="23" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#264e55">PERSONAL COFFEE ATELIER</text><text x="163" y="48" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#264e55">Make your signature cup. Pick a coffee, strength, milk,</text><text x="163" y="63" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#264e55">syrup and finishing touch. The large glass previews your</text><text x="163" y="78" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#264e55">recipe. Brew, then take three little sips.</text></svg>